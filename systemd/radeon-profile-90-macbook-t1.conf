[Service]
# Avoid the Polaris SDMA hang seen while drawing the lock screen from idle.
# The stock profiling mode disables clock and power gating; no overclocking.
ExecStartPost=/bin/sh -c 'echo profile_standard > /sys/bus/pci/devices/0000:01:00.0/power_dpm_force_performance_level'
TimeoutStartSec=15s
