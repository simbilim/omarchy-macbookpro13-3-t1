# MacBookPro13,3 four-driver speaker DSP (CS8409, davidjo driver).
#
# Measured channel map on the analog-surround-40 sink (internal-mic sweeps,
# 2026-11-05):  FL = left tweeter, FR = right tweeter,
#               RL = left woofer,  RR = right woofer.
# The stock stereo profile feeds each side's woofer and tweeter full-range.
# This graph replaces that with:
#   input -> lookahead limiter -> per side:
#     woofer:  rumble high-pass -> Linkwitz-Riley 4th-order low-pass
#     tweeter: Linkwitz-Riley 4th-order high-pass -> level, inverted polarity
# Inverted tweeter polarity summed better at the crossover on both sides
# (closed a ~10 dB hole at 2-2.5 kHz on the right).
# Tuning values live in the "control" blocks; edit and restart pipewire.

context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "MacBook Speakers"
            media.name       = "MacBook Speakers"
            audio.rate       = 44100

            filter.graph = {
                nodes = [
                    { type = builtin name = pre_l label = linear control = { "Mult" = 0.89 } }
                    { type = builtin name = pre_r label = linear control = { "Mult" = 0.89 } }
                    {
                        type   = lv2
                        name   = limiter
                        plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
                        control = { "th" = 0.708 "boost" = 0 "lk" = 5.0 "at" = 5.0 "rt" = 40.0 }
                    }

                    # Woofers
                    { type = builtin name = w_rumble_l label = bq_highpass control = { "Freq" = 120.0 "Q" = 0.707 } }
                    { type = builtin name = w_rumble_r label = bq_highpass control = { "Freq" = 120.0 "Q" = 0.707 } }
                    { type = builtin name = w_low_l    label = bq_lowshelf control = { "Freq" = 250.0 "Q" = 0.707 "Gain" = 3.0 } }
                    { type = builtin name = w_low_r    label = bq_lowshelf control = { "Freq" = 250.0 "Q" = 0.707 "Gain" = 3.0 } }
                    { type = builtin name = w_lp1_l    label = bq_lowpass  control = { "Freq" = 2500.0 "Q" = 0.707 } }
                    { type = builtin name = w_lp2_l    label = bq_lowpass  control = { "Freq" = 2500.0 "Q" = 0.707 } }
                    { type = builtin name = w_lp1_r    label = bq_lowpass  control = { "Freq" = 2500.0 "Q" = 0.707 } }
                    { type = builtin name = w_lp2_r    label = bq_lowpass  control = { "Freq" = 2500.0 "Q" = 0.707 } }
                    { type = builtin name = w_gain_l   label = linear      control = { "Mult" = 1.0 } }
                    { type = builtin name = w_gain_r   label = linear      control = { "Mult" = 1.0 } }

                    # Tweeters (negative Mult = inverted polarity)
                    { type = builtin name = t_hp1_l  label = bq_highpass  control = { "Freq" = 2500.0 "Q" = 0.707 } }
                    { type = builtin name = t_hp2_l  label = bq_highpass  control = { "Freq" = 2500.0 "Q" = 0.707 } }
                    { type = builtin name = t_hp1_r  label = bq_highpass  control = { "Freq" = 2500.0 "Q" = 0.707 } }
                    { type = builtin name = t_hp2_r  label = bq_highpass  control = { "Freq" = 2500.0 "Q" = 0.707 } }
                    { type = builtin name = t_air_l  label = bq_highshelf control = { "Freq" = 4500.0 "Q" = 0.707 "Gain" = 4.0 } }
                    { type = builtin name = t_air_r  label = bq_highshelf control = { "Freq" = 4500.0 "Q" = 0.707 "Gain" = 4.0 } }
                    { type = builtin name = t_gain_l label = linear       control = { "Mult" = -0.84 } }
                    { type = builtin name = t_gain_r label = linear       control = { "Mult" = -0.84 } }
                ]
                links = [
                    { output = "pre_l:Out"         input = "limiter:in_l" }
                    { output = "pre_r:Out"         input = "limiter:in_r" }

                    { output = "limiter:out_l"     input = "w_rumble_l:In" }
                    { output = "w_rumble_l:Out"    input = "w_low_l:In" }
                    { output = "w_low_l:Out"       input = "w_lp1_l:In" }
                    { output = "w_lp1_l:Out"       input = "w_lp2_l:In" }
                    { output = "w_lp2_l:Out"       input = "w_gain_l:In" }
                    { output = "limiter:out_r"     input = "w_rumble_r:In" }
                    { output = "w_rumble_r:Out"    input = "w_low_r:In" }
                    { output = "w_low_r:Out"       input = "w_lp1_r:In" }
                    { output = "w_lp1_r:Out"       input = "w_lp2_r:In" }
                    { output = "w_lp2_r:Out"       input = "w_gain_r:In" }

                    { output = "limiter:out_l"     input = "t_hp1_l:In" }
                    { output = "t_hp1_l:Out"       input = "t_hp2_l:In" }
                    { output = "t_hp2_l:Out"       input = "t_air_l:In" }
                    { output = "t_air_l:Out"       input = "t_gain_l:In" }
                    { output = "limiter:out_r"     input = "t_hp1_r:In" }
                    { output = "t_hp1_r:Out"       input = "t_hp2_r:In" }
                    { output = "t_hp2_r:Out"       input = "t_air_r:In" }
                    { output = "t_air_r:Out"       input = "t_gain_r:In" }
                ]
                inputs  = [ "pre_l:In" "pre_r:In" ]
                outputs = [ "t_gain_l:Out" "t_gain_r:Out" "w_gain_l:Out" "w_gain_r:Out" ]
            }

            capture.props = {
                node.name         = "macbook_t1_speakers"
                media.class       = "Audio/Sink"
                audio.channels    = 2
                audio.position    = [ FL FR ]
                priority.session  = 2000
            }
            playback.props = {
                node.name         = "macbook_t1_speakers_output"
                node.passive      = true
                stream.dont-remix = true
                audio.channels    = 4
                audio.position    = [ FL FR RL RR ]
                target.object     = "alsa_output.pci-0000_00_1f.3.analog-surround-40"
            }
        }
    }
]
