context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "MacBook Speakers Protected"
            media.name       = "MacBook Speakers Protected"
            audio.rate       = 44100
            audio.channels   = 2
            audio.position   = [ FL FR ]

            filter.graph = {
                nodes = [
                    {
                        type  = builtin
                        name  = headroom
                        label = linear
                        control = { "Mult" = 0.80 "Add" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = rumble_cut
                        label = bq_highpass
                        control = { "Freq" = 120.0 "Q" = 0.707 }
                    }
                    {
                        type  = builtin
                        name  = bass_trim
                        label = bq_lowshelf
                        control = { "Freq" = 260.0 "Q" = 0.707 "Gain" = -5.0 }
                    }
                ]
                links = [
                    { output = "headroom:Out" input = "rumble_cut:In" }
                    { output = "rumble_cut:Out" input = "bass_trim:In" }
                ]
            }

            capture.props = {
                node.name   = "macbook_t1_speaker_protect"
                media.class = "Audio/Sink"
            }
            playback.props = {
                node.name     = "macbook_t1_speaker_protect_output"
                node.passive  = true
                target.object = "alsa_output.pci-0000_00_1f.3.analog-stereo"
            }
        }
    }
]
